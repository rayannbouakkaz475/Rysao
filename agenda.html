<title>Agenda des interventions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="agenda-style">
/* Layout : bandeau compteurs en haut, calendrier annuel (12 mois) à gauche, file des tâches à droite ; une colonne sur téléphone. Urgences = couleurs des voyants machine (IEC 60204-1). */
:root{
  --bg:#ECEFF1; --panel:#FFFFFF; --sunk:#F5F7F8; --ink:#16202A; --muted:#5A6773; --line:#D2D8DD;
  --accent:#1D5C73; --accent-ink:#FFFFFF; --weekend:#E3E8EB; --ferie:#F1E7D2;
  --lv1:#2E8B57; --lv2:#2563B8; --lv3:#C98400; --lv4:#CF2E2A;
  --lv1-soft:#E2F2E8; --lv2-soft:#E1EAF7; --lv3-soft:#F8EDD5; --lv4-soft:#F9E0DF;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 6px 24px rgba(22,32,42,.08);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --panel:#192027; --sunk:#151B21; --ink:#E3E8EC; --muted:#93A0AB; --line:#2A343D;
  --accent:#6FB3CF; --accent-ink:#0E1A20; --weekend:#151B20; --ferie:#2A2418;
  --lv1:#4CC487; --lv2:#5E97F0; --lv3:#F0B23A; --lv4:#F2615C;
  --lv1-soft:#16301F; --lv2-soft:#17253A; --lv3-soft:#33270F; --lv4-soft:#3A1716;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --panel:#192027; --sunk:#151B21; --ink:#E3E8EC; --muted:#93A0AB; --line:#2A343D;
  --accent:#6FB3CF; --accent-ink:#0E1A20; --weekend:#151B20; --ferie:#2A2418;
  --lv1:#4CC487; --lv2:#5E97F0; --lv3:#F0B23A; --lv4:#F2615C;
  --lv1-soft:#16301F; --lv2-soft:#17253A; --lv3-soft:#33270F; --lv4-soft:#3A1716;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:1360px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* En-tête */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.4vw,44px);line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.yearnav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.yearnav button{border:0;background:none;padding:8px 12px;font-size:18px;line-height:1;color:var(--muted)}
.yearnav button:hover{color:var(--ink)}
.yearnav strong{font-family:var(--f-display);font-size:24px;padding:4px 6px;min-width:64px;text-align:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--lv4)}
.btn.small{padding:6px 10px;font-size:13px}

/* Compteurs */
.gauges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.gauge{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left}
.gauge[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.gauge .n{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.gauge .l{font-size:13px;color:var(--muted);line-height:1.25}
.gauge .l b{display:block;color:var(--ink);font-weight:600;font-size:14px}
.lamp{width:16px;height:16px;border-radius:50%;flex:none;background:var(--c,var(--muted));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--muted)) 22%,transparent),inset 0 -2px 3px rgba(0,0,0,.18)}
.lamp.sm{width:10px;height:10px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 22%,transparent)}
.lamp.off{background:transparent;border:2px solid var(--line);box-shadow:none}
.overdue-gauge .n{color:var(--lv4)}

/* Corps */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.month{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px}
.month h2{font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.month h2 small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:0;font-weight:500}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding-bottom:3px}
.day{position:relative;aspect-ratio:1/1;border:0;border-radius:5px;background:transparent;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;max-width:100%}
.day:hover{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.day.we{background:var(--weekend);color:var(--muted)}
.day.ferie{background:var(--ferie)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day .dots{display:flex;gap:2px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day .dots i.done{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.day.has-4{background:var(--lv4-soft)}
.day.sel .dots i{box-shadow:0 0 0 1px var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

/* File des tâches */
.queue{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;min-width:0}
.queue header{padding:16px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.queue h3{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.queue h3 small{font-family:var(--f-body);font-size:13px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:6px 8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{overflow:auto;padding:6px 8px 12px;display:flex;flex-direction:column;gap:2px}
.group{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 8px 4px;font-weight:600}
.group.late{color:var(--lv4)}

.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 8px;border-radius:8px;border-left:4px solid var(--c);background:transparent}
.task:hover{background:var(--sunk)}
.task .body{min-width:0;cursor:pointer}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.task .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.task .note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--c);white-space:nowrap}
.tag.example{background:var(--sunk);color:var(--muted);border:1px dashed var(--line);font-weight:500}
.check{appearance:none;width:20px;height:20px;border:2px solid var(--line);border-radius:5px;margin:1px 0 0;background:var(--panel);display:grid;place-content:center;cursor:pointer}
.check:checked{background:var(--lv1);border-color:var(--lv1)}
.check:checked::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.check:disabled{cursor:default;opacity:.7}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}

.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13.5px;color:var(--muted)}
.banner b{color:var(--ink)}

/* Fenêtre jour / tâche */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,16,22,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 26px)}
.dlg-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-head h3{font-family:var(--f-display);font-size:26px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em}
.dlg-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.x{border:0;background:var(--sunk);border-radius:8px;width:34px;height:34px;font-size:20px;line-height:1;color:var(--muted);flex:none}
.dlg-body{padding:12px 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.daylist{display:flex;flex-direction:column;gap:2px}
form{display:flex;flex-direction:column;gap:12px}
.form-title{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin:4px 0 0;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],textarea{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 11px;width:100%;font-weight:400;font-size:15px}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
legend{font-size:13px;font-weight:600;padding:0;margin-bottom:6px}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.levels label{position:relative}
.levels input{position:absolute;opacity:0;inset:0;cursor:pointer}
.levels .opt{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-weight:600;height:100%}
.levels .opt small{font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.2}
.levels .opt .lamp{margin-bottom:2px}
.levels input:checked + .opt{border-color:var(--c);background:var(--soft);box-shadow:inset 0 0 0 1px var(--c)}
.levels input:focus-visible + .opt{outline:2px solid var(--accent);outline-offset:2px}
.form-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.form-actions .right{display:flex;gap:8px;margin-left:auto}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--lv4);flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}

.lv1{--c:var(--lv1);--soft:var(--lv1-soft)} .lv2{--c:var(--lv2);--soft:var(--lv2-soft)}
.lv3{--c:var(--lv3);--soft:var(--lv3-soft)} .lv4{--c:var(--lv4);--soft:var(--lv4-soft)}

@media (max-width:1000px){
  .main{grid-template-columns:minmax(0,1fr)}
  .queue{position:static;max-height:none;order:-1}
  .list{max-height:420px}
}
@media (max-width:640px){
  .gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gauges .overdue-gauge{grid-column:1 / -1}
  .levels{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row2{grid-template-columns:minmax(0,1fr)}
  .year{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){.day,.btn,.gauge{transition:background-color .12s,border-color .12s}}
</style>
<div id="app"></div>
<script type="application/json" id="agenda-data">{"tasks":[{"id":"ex1","date":"2026-11-04","title":"Raccordement presse hydraulique P3","place":"Atelier emboutissage","level":3,"note":"Alim 400 V tri + terre. Vérifier le calibre du disjoncteur au TGBT.","done":false,"example":true},{"id":"ex2","date":"2026-11-06","title":"Défaut variateur convoyeur ligne 2","place":"Ligne 2","level":4,"note":"Arrêt de production. Code défaut OC2 relevé sur l'afficheur.","done":false,"example":true},{"id":"ex3","date":"2026-11-13","title":"Remplacement éclairage LED quai 4","place":"Expédition","level":1,"note":"","done":false,"example":true}]}</script>
<script id="agenda-main">
(function(){
"use strict";
var LEVELS={
  1:{label:"Faible",hint:"Quand c'est possible"},
  2:{label:"Normal",hint:"Dans la semaine"},
  3:{label:"Urgent",hint:"Sous 24 à 48 h"},
  4:{label:"Critique",hint:"Arrêt de production"}
};
var MONTHS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var DOW=["Lu","Ma","Me","Je","Ve","Sa","Di"];
var DAYNAMES=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var LS_KEY="agenda-interventions-v1";

var app=document.getElementById("app");
var state={tasks:[]};
try{state=JSON.parse(document.getElementById("agenda-data").textContent)||{tasks:[]}}catch(e){}
if(!Array.isArray(state.tasks))state.tasks=[];

// Mode : "artifact" (page partagée sur claude.ai), "local" (fichier ouvert hors claude.ai), "readonly".
var standalone=!window.claude;
var mode=standalone?"local":"pending";
var artifactNs=null;
if(standalone){
  try{var saved=localStorage.getItem(LS_KEY);if(saved){var p=JSON.parse(saved);if(p&&Array.isArray(p.tasks))state=p;}}catch(e){}
}

var today=new Date();
var view={year:today.getFullYear(),filter:"open",level:0,selected:null,editing:null,confirmDel:false};
try{var keep=sessionStorage.getItem("agenda-reopen");if(keep){sessionStorage.removeItem("agenda-reopen");keep=JSON.parse(keep);if(keep.day){view.selected=keep.day;view.year=+keep.day.slice(0,4);}}}catch(e){}

function pad(n){return(n<10?"0":"")+n}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(k){var a=k.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
var TODAY=key(today);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function longDate(k){var d=parse(k);return DAYNAMES[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()].toLowerCase()+" "+d.getFullYear()}
function shortDate(k){var d=parse(k);return DAYNAMES[d.getDay()].slice(0,3)+". "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,4).toLowerCase()+"."}

// Jours fériés en France
var ferieCache={};
function feries(y){
  if(ferieCache[y])return ferieCache[y];
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  var easter=new Date(y,mo-1,da);
  function plus(n){var x=new Date(easter);x.setDate(x.getDate()+n);return key(x)}
  var r={};
  r[y+"-01-01"]="Jour de l'an";r[plus(1)]="Lundi de Pâques";r[y+"-05-01"]="Fête du Travail";r[y+"-05-08"]="Victoire 1945";
  r[plus(39)]="Ascension";r[plus(50)]="Lundi de Pentecôte";r[y+"-07-14"]="Fête nationale";r[y+"-08-15"]="Assomption";
  r[y+"-11-01"]="Toussaint";r[y+"-11-11"]="Armistice";r[y+"-12-25"]="Noël";
  return ferieCache[y]=r;
}

function byDay(){var m={};state.tasks.forEach(function(t){(m[t.date]=m[t.date]||[]).push(t)});return m}
function sortTasks(a,b){if(a.done!==b.done)return a.done?1:-1;if(a.date!==b.date)return a.date<b.date?-1:1;return b.level-a.level}
function canWrite(){return mode==="artifact"||mode==="local"}

/* ---------- Rendu ---------- */
function render(){
  var map=byDay();
  var open=state.tasks.filter(function(t){return !t.done});
  var late=open.filter(function(t){return t.date<TODAY});
  var counts={1:0,2:0,3:0,4:0};open.forEach(function(t){counts[t.level]++});
  var hasExamples=state.tasks.some(function(t){return t.example});

  var h="";
  h+='<header class="top"><div class="brand"><h1>Agenda des interventions</h1><p>Raccordements machines, dépannages et travaux électriques. Cliquez sur un jour pour voir ou noter ce qu\'il y a à faire.</p></div>';
  h+='<div class="actions"><div class="yearnav"><button type="button" id="prevY" aria-label="Année précédente">‹</button><strong class="mono" aria-live="polite">'+view.year+'</strong><button type="button" id="nextY" aria-label="Année suivante">›</button></div>';
  h+='<button type="button" class="btn" id="todayBtn">Aujourd\'hui</button>';
  if(canWrite())h+='<button type="button" class="btn primary" id="addBtn">+ Nouvelle tâche</button>';
  h+='</div></header>';

  if(mode==="readonly")h+='<div class="banner"><b>Lecture seule.</b> Vous consultez l\'agenda. Seul son propriétaire peut ajouter ou modifier des tâches.</div>';
  if(mode==="local")h+='<div class="banner"><b>Mode hors ligne.</b> Les tâches sont enregistrées dans ce navigateur uniquement.</div>';
  if(hasExamples&&canWrite())h+='<div class="banner"><b>Tâches d\'exemple.</b> Les tâches marquées « Exemple » montrent le fonctionnement. <button type="button" class="btn small" id="clearEx">Effacer les exemples</button></div>';

  h+='<div class="gauges" role="group" aria-label="Tâches à faire par urgence">';
  for(var lv=4;lv>=1;lv--){
    h+='<button type="button" class="gauge lv'+lv+'" data-lv="'+lv+'" aria-pressed="'+(view.level===lv)+'"><span class="lamp'+(counts[lv]?'':' off')+'"></span><span class="n">'+counts[lv]+'</span><span class="l"><b>'+LEVELS[lv].label+'</b>'+LEVELS[lv].hint+'</span></button>';
  }
  h+='<div class="gauge overdue-gauge"><span class="n">'+late.length+'</span><span class="l"><b>En retard</b>Date passée, pas terminée</span></div>';
  h+='</div>';

  h+='<div class="main"><section aria-label="Calendrier '+view.year+'"><div class="year">';
  var fer=feries(view.year);
  for(var m=0;m<12;m++){
    var first=new Date(view.year,m,1),days=new Date(view.year,m+1,0).getDate(),off=(first.getDay()+6)%7;
    var mCount=0;
    var cells="";
    for(var b=0;b<off;b++)cells+='<span></span>';
    for(var d=1;d<=days;d++){
      var dt=new Date(view.year,m,d),k=key(dt),wd=dt.getDay();
      var list=map[k]||[];
      var cls="day";
      if(wd===0||wd===6)cls+=" we";
      if(fer[k])cls+=" ferie";
      if(k===TODAY)cls+=" today";
      if(k===view.selected)cls+=" sel";
      var dots="",openHere=list.filter(function(t){return !t.done});
      mCount+=openHere.length;
      if(openHere.some(function(t){return t.level===4}))cls+=" has-4";
      list.slice().sort(function(a,b){return (a.done-b.done)||(b.level-a.level)}).slice(0,3).forEach(function(t){dots+='<i class="lv'+t.level+(t.done?' done':'')+'"></i>'});
      var lab=longDate(k)+(fer[k]?", férié ("+fer[k]+")":"")+(list.length?", "+list.length+" tâche"+(list.length>1?"s":""):"");
      cells+='<button type="button" class="'+cls+'" data-day="'+k+'" aria-label="'+esc(lab)+'"'+(fer[k]?' title="'+esc(fer[k])+'"':'')+'><span>'+d+'</span><span class="dots">'+dots+'</span></button>';
    }
    h+='<article class="month"><h2>'+MONTHS[m]+'<small>'+(mCount?mCount+' à faire':'')+'</small></h2><div class="grid7">'+DOW.map(function(x){return'<span class="dow">'+x+'</span>'}).join("")+cells+'</div></article>';
  }
  h+='</div><div class="legend" style="margin-top:14px"><span><i class="lamp sm lv4"></i>Critique</span><span><i class="lamp sm lv3"></i>Urgent</span><span><i class="lamp sm lv2"></i>Normal</span><span><i class="lamp sm lv1"></i>Faible</span><span><i class="sw" style="background:var(--ferie)"></i>Jour férié</span><span><i class="sw" style="background:var(--weekend)"></i>Week-end</span></div></section>';

  // File des tâches
  var shown=state.tasks.filter(function(t){
    if(view.filter==="open"&&t.done)return false;
    if(view.filter==="done"&&!t.done)return false;
    if(view.level&&t.level!==view.level)return false;
    return true;
  }).sort(sortTasks);
  if(view.filter==="done")shown.reverse();
  h+='<aside class="queue" aria-label="Liste des tâches"><header><h3>Tâches<small>'+(view.level?'Filtre : '+LEVELS[view.level].label+' · <a href="#" id="clrLv" style="color:var(--accent)">tout voir</a>':state.tasks.length+' au total')+'</small></h3>';
  h+='<div class="seg" role="group" aria-label="Afficher">'+[["open","À faire"],["done","Terminées"],["all","Toutes"]].map(function(o){return'<button type="button" data-filter="'+o[0]+'" aria-pressed="'+(view.filter===o[0])+'">'+o[1]+'</button>'}).join("")+'</div></header><div class="list">';
  if(!shown.length){
    h+='<div class="empty"><b>'+(state.tasks.length?'Rien ici':'Aucune tâche')+'</b>'+(state.tasks.length?'Aucune tâche ne correspond à ce filtre.':(canWrite()?'Cliquez sur un jour du calendrier ou sur « Nouvelle tâche » pour noter un travail.':'Aucun travail n\'est encore noté.'))+'</div>';
  }else{
    var lastGroup=null;
    shown.forEach(function(t){
      var g=t.done?"Terminées":(t.date<TODAY?"En retard":(t.date===TODAY?"Aujourd'hui":"À venir"));
      if(view.filter==="done")g="Terminées";
      if(g!==lastGroup){h+='<div class="group'+(g==="En retard"?" late":"")+'">'+g+'</div>';lastGroup=g}
      h+=taskRow(t,true);
    });
  }
  h+='</div></aside></div>';

  app.innerHTML=h;
  bind();
}

function taskRow(t,showDate){
  var lv=LEVELS[t.level]||LEVELS[2];
  var s='<div class="task lv'+t.level+(t.done?' done':'')+'">';
  s+='<input type="checkbox" class="check" data-toggle="'+esc(t.id)+'" '+(t.done?'checked ':'')+(canWrite()?'':'disabled ')+'aria-label="Marquer « '+esc(t.title)+' » comme terminée">';
  s+='<div class="body" data-open="'+esc(t.id)+'" role="button" tabindex="0"><div class="t">'+esc(t.title)+'</div><div class="meta">';
  if(showDate)s+='<span class="mono">'+shortDate(t.date)+' · S'+isoWeek(parse(t.date))+'</span>';
  if(t.place)s+='<span>'+esc(t.place)+'</span>';
  s+='</div>'+(t.note&&!showDate?'<div class="note">'+esc(t.note)+'</div>':'')+'</div>';
  s+='<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="tag"><i class="lamp sm"></i>'+lv.label+'</span>'+(t.example?'<span class="tag example">Exemple</span>':'')+'</div></div>';
  return s;
}

function bind(){
  app.querySelector("#prevY").onclick=function(){view.year--;render()};
  app.querySelector("#nextY").onclick=function(){view.year++;render()};
  app.querySelector("#todayBtn").onclick=function(){view.year=today.getFullYear();openDay(TODAY)};
  var add=app.querySelector("#addBtn");if(add)add.onclick=function(){openDay(view.selected||TODAY,"new")};
  var clr=app.querySelector("#clearEx");if(clr)clr.onclick=function(){state.tasks=state.tasks.filter(function(t){return !t.example});save("Exemples effacés")};
  var clrLv=app.querySelector("#clrLv");if(clrLv)clrLv.onclick=function(e){e.preventDefault();view.level=0;render()};
  app.querySelectorAll("[data-day]").forEach(function(b){b.onclick=function(){openDay(b.getAttribute("data-day"))}});
  app.querySelectorAll("[data-lv]").forEach(function(b){b.onclick=function(){var l=+b.getAttribute("data-lv");view.level=view.level===l?0:l;if(view.level)view.filter="open";render()}});
  app.querySelectorAll("[data-filter]").forEach(function(b){b.onclick=function(){view.filter=b.getAttribute("data-filter");render()}});
  bindTasks(app);
}
function bindTasks(root){
  root.querySelectorAll("[data-toggle]").forEach(function(c){c.onchange=function(){var t=find(c.getAttribute("data-toggle"));if(!t)return;t.done=c.checked;save(t.done?"Tâche terminée":"Tâche rouverte")}});
  root.querySelectorAll("[data-open]").forEach(function(el){
    var go=function(){var t=find(el.getAttribute("data-open"));if(t){view.year=+t.date.slice(0,4);openDay(t.date,t.id)}};
    el.onclick=go;el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
  });
}
function find(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];return null}

/* ---------- Fenêtre d'un jour ---------- */
var dlg=document.createElement("dialog");dlg.id="dayDialog";document.body.appendChild(dlg);
dlg.addEventListener("close",function(){view.selected=null;view.editing=null;render()});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});

function openDay(k,editing){
  view.selected=k;view.editing=editing||null;view.confirmDel=false;
  render();drawDialog();
  if(!dlg.open)try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}
  var f=dlg.querySelector("#f-title");if(f&&view.editing)f.focus();
}
function drawDialog(){
  var k=view.selected,fer=feries(+k.slice(0,4))[k];
  var list=state.tasks.filter(function(t){return t.date===k}).sort(sortTasks);
  var editT=view.editing&&view.editing!=="new"?find(view.editing):null;
  var s='<div class="dlg"><div class="dlg-head"><div><h3>'+longDate(k)+'</h3><p class="mono">Semaine '+isoWeek(parse(k))+(fer?' · Férié : '+esc(fer):'')+(k<TODAY?' · Date passée':'')+'</p></div><button type="button" class="x" id="dlgClose" aria-label="Fermer">×</button></div><div class="dlg-body">';
  if(list.length){
    s+='<div class="daylist">';
    list.forEach(function(t){s+=taskRow(t,false)});
    s+='</div>';
  }else if(!view.editing){
    s+='<div class="empty" style="padding:18px 8px"><b>Journée libre</b>'+(canWrite()?'Rien de prévu ce jour-là.':'Aucune tâche notée ce jour-là.')+'</div>';
  }
  if(canWrite()){
    if(view.editing){
      var t=editT||{date:k,title:"",place:"",level:2,note:""};
      s+='<form id="taskForm" novalidate><p class="form-title">'+(editT?'Modifier la tâche':'Nouvelle tâche')+'</p>';
      s+='<label class="f" for="f-title">Ce qu\'il y a à faire<input type="text" id="f-title" required maxlength="140" placeholder="Ex. : Raccordement tour CN, armoire A12" value="'+esc(t.title)+'"></label>';
      s+='<div class="row2"><label class="f" for="f-place">Machine / zone <span class="h">facultatif</span><input type="text" id="f-place" maxlength="80" placeholder="Ex. : Atelier 3, ligne 2" value="'+esc(t.place)+'"></label>';
      s+='<label class="f" for="f-date">Date<input type="date" id="f-date" value="'+t.date+'" required></label></div>';
      s+='<fieldset><legend>Degré d\'urgence</legend><div class="levels">';
      [1,2,3,4].forEach(function(l){s+='<label class="lv'+l+'"><input type="radio" name="lvl" id="f-lv'+l+'" value="'+l+'"'+(t.level===l?' checked':'')+'><span class="opt"><i class="lamp sm"></i>'+LEVELS[l].label+'<small>'+LEVELS[l].hint+'</small></span></label>'});
      s+='</div></fieldset>';
      s+='<label class="f" for="f-note">Détails <span class="h">matériel, section de câble, contact…</span><textarea id="f-note" maxlength="1000">'+esc(t.note)+'</textarea></label>';
      s+='<div class="form-actions">';
      if(editT){s+=view.confirmDel?'<span class="confirm">Supprimer cette tâche ? <button type="button" class="btn small danger" id="delYes">Supprimer</button><button type="button" class="btn small" id="delNo">Annuler</button></span>':'<button type="button" class="btn danger" id="delBtn">Supprimer</button>'}
      s+='<span class="right"><button type="button" class="btn" id="cancelBtn">Annuler</button><button type="submit" class="btn primary">'+(editT?'Enregistrer':'Ajouter')+'</button></span></div></form>';
    }else{
      s+='<button type="button" class="btn primary" id="newHere">+ Ajouter une tâche ce jour</button>';
    }
  }
  s+='</div></div>';
  dlg.innerHTML=s;
  dlg.querySelector("#dlgClose").onclick=function(){dlg.close()};
  var nh=dlg.querySelector("#newHere");if(nh)nh.onclick=function(){view.editing="new";drawDialog();dlg.querySelector("#f-title").focus()};
  bindTasks(dlg);
  var form=dlg.querySelector("#taskForm");
  if(form){
    dlg.querySelector("#cancelBtn").onclick=function(){view.editing=null;drawDialog()};
    var del=dlg.querySelector("#delBtn");if(del)del.onclick=function(){view.confirmDel=true;drawDialog()};
    var dn=dlg.querySelector("#delNo");if(dn)dn.onclick=function(){view.confirmDel=false;drawDialog()};
    var dy=dlg.querySelector("#delYes");if(dy)dy.onclick=function(){state.tasks=state.tasks.filter(function(x){return x.id!==editT.id});view.editing=null;save("Tâche supprimée")};
    form.onsubmit=function(e){
      e.preventDefault();
      var title=dlg.querySelector("#f-title").value.trim();
      var date=dlg.querySelector("#f-date").value;
      if(!title){dlg.querySelector("#f-title").focus();toast("Indiquez ce qu'il y a à faire.");return}
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast("Choisissez une date valide.");return}
      var lvEl=dlg.querySelector('input[name="lvl"]:checked');
      var rec={title:title,place:dlg.querySelector("#f-place").value.trim(),date:date,level:lvEl?+lvEl.value:2,note:dlg.querySelector("#f-note").value.trim()};
      if(editT){Object.assign(editT,rec);delete editT.example}
      else{rec.id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);rec.done=false;state.tasks.push(rec)}
      view.selected=date;view.year=+date.slice(0,4);view.editing=null;
      save(editT?"Tâche modifiée":"Tâche ajoutée");
    };
  }
}

/* ---------- Enregistrement ---------- */
var tEl=null,tTimer=0;
function toast(msg){if(!tEl){tEl=document.createElement("div");tEl.className="toast";tEl.setAttribute("role","status");document.body.appendChild(tEl)}tEl.textContent=msg;tEl.hidden=false;clearTimeout(tTimer);tTimer=setTimeout(function(){tEl.hidden=true},2600)}

var RESET=(function(){var s=document.head&&document.head.querySelector("style");return s?s.textContent:""})();
function buildDoc(){
  var data=JSON.stringify({tasks:state.tasks}).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
    +'<title>Agenda des interventions</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">\n'
    +document.getElementById("agenda-style").outerHTML+'\n<div id="app"></div>\n'
    +'<script type="application/json" id="agenda-data">'+data+'<\/script>\n'
    +document.getElementById("agenda-main").outerHTML+'\n</body></html>';
}
var saving=false;
function save(msg){
  if(mode==="local"){
    try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast("Impossible d'enregistrer dans ce navigateur.");return}
    if(dlg.open)drawDialog();render();toast(msg);return;
  }
  if(mode!=="artifact"||!artifactNs||saving)return;
  saving=true;toast("Enregistrement…");
  try{sessionStorage.setItem("agenda-reopen",JSON.stringify({day:dlg.open?view.selected:null}))}catch(e){}
  if(dlg.open)drawDialog();render();
  artifactNs.publish(buildDoc()).then(function(){toast(msg)},function(err){
    saving=false;
    var code=err&&err.code;
    if(code==="conflict"){toast("L'agenda vient d'être modifié ailleurs. Rechargement…");return}
    if(code==="not_writer"||code==="not_granted"){mode="readonly";if(dlg.open)dlg.close();render();toast("Cet agenda est en lecture seule pour vous.");return}
    if(code==="rate_limited"){toast("Trop d'enregistrements rapprochés. Réessayez dans un instant.");return}
    toast("Enregistrement impossible pour le moment. Réessayez.");
  });
}

render();
if(view.selected)openDay(view.selected);

if(!standalone&&window.claude&&typeof window.claude.use==="function"){
  Promise.all([window.claude.use("artifact"),window.claude.use("user").catch(function(){return null})]).then(function(r){
    artifactNs=r[0];var user=r[1];
    if(!artifactNs){mode="readonly";render();return}
    if(user&&typeof user.canEdit==="function"){
      return user.canEdit().then(function(ok){mode=ok?"artifact":"readonly";render();if(dlg.open)drawDialog()});
    }
    mode="artifact";render();if(dlg.open)drawDialog();
  }).catch(function(){mode="readonly";render()});
}else if(!standalone){mode="readonly";render()}
})();
</script>
