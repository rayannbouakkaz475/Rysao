# RYSAO Studio — lancement complet (studio + séparation de pistes IA).
#
#   docker compose up --build
#
# Puis ouvrez http://localhost:8000
#
# La première séparation télécharge le modèle Demucs (~80 Mo) ; il est
# conservé dans le volume « model-cache » pour les fois suivantes.
services:
  studio:
    build:
      context: .
      dockerfile: backend/Dockerfile.demucs
    image: rysao-studio:full
    ports:
      - "8000:8000"
    environment:
      # Accès privé : définissez votre mot de passe avant de lancer, ex :
      #   RYSAO_PASSWORD="mon-secret" docker compose up --build
      # (sinon la valeur par défaut ci-dessous est utilisée).
      - RYSAO_PASSWORD=${RYSAO_PASSWORD:-rysao}
      # Secret de session fixe pour rester connecté après un redémarrage.
      - RYSAO_SECRET=${RYSAO_SECRET:-rysao-secret-local}
    volumes:
      - model-cache:/root/.cache          # modèles Demucs / MusicGen persistés
      - ./backend/uploads:/app/backend/uploads
      - ./backend/outputs:/app/backend/outputs
    restart: unless-stopped
    # Pour la séparation sur GPU NVIDIA, décommentez (nécessite nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  model-cache:
