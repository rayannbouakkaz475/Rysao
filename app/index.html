<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>RYSAO Cards — Scan, centrage & gradation</title>
<meta name="description" content="Application TCG : scan caméra en temps réel, analyse de centrage, estimation de note de gradation, prix marché, collection et réseau. Pokémon, One Piece, Lorcana, Topps.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='bold' font-size='34' fill='%2300e0c6' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body data-theme="pokemon">

  <div class="bg-theme" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">RYSAO</span><span class="brand-tcg">Cards</span>
      <span class="brand-tag" id="brandTag"></span>
    </div>
    <div class="theme-bar" id="themeBar"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab on" data-view="scan" data-i18n="nav_scan"><span class="tab-ic">📷</span><span class="tab-l"></span></button>
    <button class="tab" data-view="refs" data-i18n="nav_refs"><span class="tab-ic">📚</span><span class="tab-l"></span></button>
    <button class="tab" data-view="prices" data-i18n="nav_prices"><span class="tab-ic">💶</span><span class="tab-l"></span></button>
    <button class="tab" data-view="collection" data-i18n="nav_collection"><span class="tab-ic">🗂️</span><span class="tab-l"></span></button>
    <button class="tab" data-view="grading" data-i18n="nav_grading"><span class="tab-ic">🏆</span><span class="tab-l"></span></button>
    <button class="tab" data-view="community" data-i18n="nav_community"><span class="tab-ic">🤝</span><span class="tab-l"></span></button>
    <button class="tab" data-view="settings" data-i18n="nav_settings"><span class="tab-ic">⚙️</span><span class="tab-l"></span></button>
  </nav>

  <script src="./js/i18n.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/providers.js"></script>
  <script src="./js/backend.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/scanner.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/native.js"></script>
</body>
</html>
